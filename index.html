    <script>
      // 앱 업데이트 즉시 반영 — WKWebView/HTTP의 index.html 10분 캐시 우회.
      // 배포된 version.json(no-store)과 현재 로드된 엔트리 해시를 비교해, 다르면
      // ?v=<hash> 캐시버스트로 새 index를 강제 로드한다. 해시 청크는 불변이라 그대로 캐시.
      (function () {
        try {
          fetch('version.json?ts=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) {
              if (!j || !j.build) return;
              var el = document.querySelector('script[src*="/assets/index-"]');
              var m = el && el.src.match(/index-([A-Za-z0-9_-]+)\.js/);
              var cur = m ? m[1] : '';
              if (!cur || cur === j.build) return;              // 이미 최신
              var u = new URL(location.href);
              if (u.searchParams.get('v') === j.build) return;  // 이 버전으로 이미 리로드함 — 루프 방지
              u.searchParams.set('v', j.build);
              location.replace(u.toString());
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
    <!-- 부팅 워치독.
         앱은 매 실행 웹을 원격 로드한다(capacitor.config.ts server.url). 그래서 엔트리 번들이
         한 번이라도 실행되지 않으면 — 캐시된 옛 index.html이 이미 삭제된 자산을 가리키거나,
         실행 순간 네트워크가 아직 안 붙었거나 — 화면이 검은 채로 굳는다.
         이때는 전역 오류 핸들러도 그 번들 안에 있어 로그조차 남지 않는다(장애가 눈에 안 보인다).
         위 version.json 검사가 1차 복구지만 fetch가 실패하면 조용히 포기하므로, 최후 안전망으로
         "일정 시간 안에 화면이 그려졌는가"를 직접 본다. 렌더 여부는 배포 경로·네트워크와 무관한
         유일한 판정 기준이다. 무한 새로고침을 막으려 세션당 1회로 제한한다. -->
    <script>
      (function () {
        var GRACE_MS = 6000;      // 느린 네트워크에서 정상 부팅되는 시간까지 기다린다
        var COOLDOWN_MS = 60000;  // 이 시간 안에 이미 시도했으면 다시 하지 않는다(재부팅 루프 방지)
        var KEY = 'boot_stall_reload_at';
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return; // 정상 렌더됨
          var last = 0;
          try {
            last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < COOLDOWN_MS) return;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {
            return; // 저장소를 못 쓰면 판단 근거가 없어 새로고침하지 않는다
          }
          // 이 경로는 번들이 안 돌아 텔레메트리가 0이 된다 → 여기서 직접 남긴다.
          // sendBeacon은 쓸 수 없다: JSON 본문은 CORS 사전요청을 유발하는데 beacon은 사전요청을
          // 못 보내 그대로 폐기된다. keepalive fetch는 사전요청이 가능하고 페이지 이탈 후에도 완료된다.
          try {
            var cid = null;
            try { cid = localStorage.getItem('dn_cid'); } catch (e2) {}
            fetch('https://danjinote-api.tripvoice.co.kr/api/log', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              keepalive: true,
              body: JSON.stringify({
                event: 'boot_stall',
                clientId: cid,
                detail: { href: location.href, online: navigator.onLine }
              })
            }).catch(function () {});
          } catch (e3) {}
          var u = new URL(location.href);
          u.searchParams.set('r', String(Date.now())); // 캐시 우회로 새 index.html을 받는다
          location.replace(u.toString());
        }, GRACE_MS);
      })();
    </script>
