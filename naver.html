<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>네이버 부동산</title>
<style>
  :root{ --ink:#191F28; --ink-3:#8B95A1; --line:#E5E8EB; --surface-2:#F6F8FA; --green:#03C75A; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--ink); background:#fff;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
  }
  .spinner{ width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--green);
    border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .muted{ color:var(--ink-3); font-size:14px; }
  #hub{ display:none; width:100%; max-width:360px; }
  #hub h1{ font-size:19px; font-weight:800; margin:4px 0 6px; }
  #hub .sub{ color:var(--ink-3); font-size:13.5px; line-height:1.5; margin:0 0 22px; }
  .btn{ display:flex; align-items:center; justify-content:center; width:100%; height:52px;
    border-radius:14px; font-weight:800; font-size:15.5px; text-decoration:none; margin-top:12px; }
  .btn.primary{ background:var(--green); color:#fff; }
  .btn.ghost{ background:var(--surface-2); color:var(--ink); }
</style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="muted">네이버 부동산으로 이동 중…</div>
  </div>

  <div id="hub">
    <h1>네이버 부동산에서 검색</h1>
    <p class="sub">신축 등 일부 단지는 이름으로 바로 검색되지 않을 수 있어요.<br>아래에서 단지·지역을 직접 검색해 보세요.</p>
    <a id="search" class="btn primary" href="https://fin.land.naver.com/search">단지·지역 검색하기 ›</a>
    <a id="retry" class="btn ghost" href="#">이 단지 다시 보기</a>
  </div>

<script>
  (function(){
    var p = new URLSearchParams(location.search);
    var q = (p.get('q') || '').trim();
    // 뒤로가기 시 URL 쿼리가 유실될 수 있어 최초 진입 때 단지명을 보존한다.
    try {
      if (q) sessionStorage.setItem('nv_q', q);
      else q = (sessionStorage.getItem('nv_q') || '').trim();
    } catch (_) {}
    var target = 'https://m.land.naver.com/search/result/' + encodeURIComponent(q);

    function showHub(){
      // '이 단지 다시 보기' 링크는 최신 q(쿼리 유실 시 sessionStorage 폴백)로 매번 갱신.
      // 단지명을 알 수 없으면 빈 링크 대신 숨긴다.
      var qq = q;
      try { if (!qq) qq = (sessionStorage.getItem('nv_q') || '').trim(); } catch (_) {}
      var retry = document.getElementById('retry');
      if (retry) {
        if (qq) { retry.setAttribute('href', 'https://m.land.naver.com/search/result/' + encodeURIComponent(qq)); retry.style.display = ''; }
        else retry.style.display = 'none';
      }
      var l = document.getElementById('loading'); if (l) l.style.display = 'none';
      var h = document.getElementById('hub'); if (h) h.style.display = 'block';
    }

    // 리다이렉트 트랩 방지 + 뒤로가기 복귀 지점 확정.
    // 로드 중 location.href 이동은 브라우저가 히스토리를 '치환'해 이 페이지가 사라진다(뒤로가기 불가).
    // 그래서 히스토리를 결정론적으로 구성한다:
    //   1) replaceState 로 현재 엔트리 URL에 '#go' 마커를 심는다 → 이게 '뒤로가기 복귀 지점'.
    //   2) pushState 로 여분 엔트리(마커 없음)를 하나 쌓는다.
    //   3) location.replace(네이버) 로 여분 엔트리를 네이버로 '치환'한다.
    //   결과 히스토리: [ naver.html?q=X#go , 네이버결과 ]  → 뒤로가기하면 '#go' 엔트리로 복귀.
    // 복귀 엔트리에서 다시 run()이 돌면 location.hash === '#go' 이므로 재이동 없이 허브를 띄운다.
    // (해시는 히스토리 엔트리에 그대로 복원되는 History API 표준 → 실 Safari에서 확정적으로 동작)
    function run(e){
      if (location.hash === '#go' || (e && e.persisted)) { showHub(); return; }  // 복귀 → 허브
      if (q) {
        var base = location.pathname + location.search;
        try {
          history.replaceState(null, '', base + '#go');  // 복귀 지점(마커)
          history.pushState(null, '', base);             // 리다이렉트용 여분 엔트리
        } catch (_) {}
        location.replace(target);        // 여분 엔트리를 네이버로 치환(자동 이동) → 뒤로가기 시 '#go'로 복귀
      } else {
        showHub();
      }
    }
    window.addEventListener('pageshow', run);
  })();
</script>
</body>
</html>
